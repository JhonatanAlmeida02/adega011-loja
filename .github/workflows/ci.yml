name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Testes unitários (CEP, composição dos kits, estoque, variações…)
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      # Build + testes de ponta a ponta em modo demonstração (sem Supabase)
      - run: npm run test:e2e

  # WMS: migrations, RLS, concorrência, idempotência e integração (simulador) num PostgreSQL real
  wms-banco:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      WMS_TEST_DB: wms_test
      WMS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wms_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm ci
      - run: bash scripts/wms-db-local.sh
      - run: npm run test:wms
      - run: npx playwright install --with-deps chromium
      # Fluxo no navegador com Auth falso (somente teste) e o mesmo banco
      - run: npm run test:e2e:wms
